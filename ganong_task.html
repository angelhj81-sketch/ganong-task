<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word Listening Task</title>
<style>
  :root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mute:#6b7280;--line:#dcd9d0;--accent:#2b5fd9;--accent-d:#1e47a8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #app{width:100%;max-width:640px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:36px 32px;box-shadow:0 2px 14px rgba(0,0,0,.04)}
  h1{font-size:24px;margin:0 0 12px} h2{font-size:20px;margin:0 0 10px}
  p{margin:0 0 14px} .ko{color:var(--mute);font-size:15px}
  label{display:block;margin:14px 0 4px;font-weight:600;font-size:15px}
  input,select{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:#fff}
  button{font:inherit;cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:12px 26px;font-weight:600;margin-top:12px}
  .btn:hover{background:var(--accent-d)} .btn:disabled{background:#b9c3dd;cursor:default}
  .row{display:flex;gap:10px;align-items:center;margin:6px 0}
  .play{background:#eef2fb;border:1px solid #cdd8f2;color:var(--accent);border-radius:8px;padding:6px 12px;min-width:44px}
  .lex{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;margin:12px 0 4px}
  .lex .item{display:flex;align-items:center;gap:10px;font-size:19px}
  .choices{display:flex;gap:20px;justify-content:center;margin:34px 0 10px}
  .choice{flex:1;max-width:240px;font-size:30px;padding:30px 10px;background:#fff;border:2px solid var(--line);border-radius:12px;font-weight:600}
  .choice:enabled:hover{border-color:var(--accent);background:#f3f6ff}
  .choice:disabled{color:#b8b8b8;border-color:#eceae3;cursor:default}
  .center{text-align:center} .big{font-size:60px;margin:40px 0;color:var(--mute)}
  .bar{height:6px;background:#ece9e0;border-radius:3px;margin-bottom:26px}.bar>div{height:100%;background:var(--accent);border-radius:3px;width:0}
  table{border-collapse:collapse;width:100%;margin:10px 0}td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:15px}
  .note{font-size:14px;color:var(--mute)} .err{color:#b42318}
</style>
</head>

    <p class="ko">짧은 영어 단어를 듣고, 두 보기 중 들은 단어를 고르는 과제입니다 (약 6분).</p>
    <p>Please use <b>headphones</b> in a <b>quiet place</b>. Your responses are anonymous and used for research only. You may stop at any time by closing this page.</p>
    <p class="ko">헤드폰을 쓰고 조용한 곳에서 해주세요. 응답은 익명으로 연구 목적으로만 사용됩니다.</p>
    <label>Your first language / 모국어</label>
    <select id="l1"><option value="">— select —</option><option>Korean</option><option>English</option><option>Other</option></select>
    <label>Age / 나이</label><input id="age" type="number" min="18" max="99">
    <label style="font-weight:400"><input id="ok" type="checkbox" style="width:auto;margin-right:8px">I am 18 or older, I am wearing headphones, and I agree to participate. / 만 18세 이상이며 헤드폰을 착용했고 참여에 동의합니다.</label>
    <button class="btn" id="go">Start</button><p id="msg" class="err"></p>`);
  document.getElementById('go').onclick = () => {
    const l1 = document.getElementById('l1').value, age = document.getElementById('age').value;
    if(!l1 || !age || !document.getElementById('ok').checked){ document.getElementById('msg').textContent = 'Please fill in everything and tick the box. / 모두 입력하고 체크해 주세요.'; return; }
    Object.assign(subject, {l1, age:+age}); screenInstructions();
  };
}

function screenInstructions(){
  render(`
    <h2>How it works</h2>
    <p>1. Listen to the word.<br>2. Two choices appear. Click the word you heard (or press <b>F</b> = left, <b>J</b> = right).<br>3. Respond quickly, but go with what you actually heard.</p>
    <p>Some of the choices are real English words and some are not.</p>
    <p class="ko">보기 중에는 실제 영어 단어가 아닌 것도 있습니다.</p>
    <p class="ko">단어를 듣고 → 두 보기 중 들은 단어를 클릭하세요 (F=왼쪽, J=오른쪽). 들린 대로 빠르게 답해 주세요.</p>
    <p class="note">There are no right or wrong answers for unclear sounds. / 모호한 소리에는 정답이 없습니다.</p>
    <button class="btn" id="go">Start the task</button>`);
  document.getElementById('go').onclick = runTask;
}

/* ---------- trials ---------- */
function buildTrials(){
  const t = [];
  for(const k of Object.keys(PAIRS)){
    for(const [type, n] of Object.entries(REPS)){
      for(let i=0;i<n;i++){
        const wordLeft = (i % 2 === 0);               // balance side within each cell
        t.push({pair:k, stim_type:type, audio_file:`${k}_${type}`, word:PAIRS[k].word, non:PAIRS[k].non, wordLeft});
      }
    }
  }
  shuffle(t);
  // avoid identical audio twice in a row
  for(let i=1;i<t.length;i++){ if(t[i].audio_file===t[i-1].audio_file){ const j=t.findIndex((x,idx)=>idx>i&&x.audio_file!==t[i].audio_file&&x.audio_file!==t[i+1]?.audio_file); if(j>0)[t[i],t[j]]=[t[j],t[i]]; } }
  return t;
}

async function runTask(){
  trials = buildTrials();
  Object.keys(PAIRS).forEach(k => ['word','amb','non'].forEach(s => aud(`${k}_${s}`)));
  for(let i=0;i<trials.length;i++){
    const t = trials[i], left = t.wordLeft ? t.word : t.non, right = t.wordLeft ? t.non : t.word;
    render(`<div class="bar"><div style="width:${(i/trials.length)*100}%"></div></div>
      <div class="center big">+</div>`);
    await sleep(500);
    render(`<div class="bar"><div style="width:${(i/trials.length)*100}%"></div></div>
      <div class="center note">Listen… / 듣는 중…</div>
      <div class="choices"><button class="choice" disabled>${left}</button><button class="choice" disabled>${right}</button></div>`);
    const t0 = performance.now(), tEnd = await playAndWait(t.audio_file);
    const btns = document.querySelectorAll('.choice'); btns.forEach(b => b.disabled = false);
    document.querySelector('.center.note').textContent = 'Which word did you hear? / 어느 단어였나요?';
    const resp = await new Promise(res => {
      const done = (side) => { document.removeEventListener('keydown', kd); res(side); };
      const kd = e => { const k = e.key.toLowerCase(); if(k==='f') done(0); if(k==='j') done(1); };
      btns[0].onclick = () => done(0); btns[1].onclick = () => done(1);
      document.addEventListener('keydown', kd);
    });
    const tResp = performance.now(), response = resp===0 ? left : right;
    results.push({participant_id:pid, trial_index:i+1, pair:t.pair, stim_type:t.stim_type, audio_file:t.audio_file+'.wav',
      word_option:t.word, nonword_option:t.non, option_left:left, option_right:right, response,
      chose_word: response===t.word ? 1 : 0, rt_from_onset: Math.round(tResp-t0), rt_from_end: Math.round(tResp-tEnd),
      created_at:new Date().toISOString()});
    try{ localStorage.setItem('ganong_backup_'+pid, JSON.stringify({subject, results})); }catch(e){}
  }
  await finish();
}

/* ---------- saving ---------- */
function toCSV(rows){ if(!rows.length) return ''; const cols = Object.keys(rows[0]); const esc = v => '"'+String(v??'').replace(/"/g,'""')+'"';
  return cols.join(',')+'\n'+rows.map(r => cols.map(c => esc(r[c])).join(',')).join('\n'); }
function downloadCSV(){
  const rows = results.map(r => ({...r, l1:subject.l1, age:subject.age}));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCSV(rows)], {type:'text/csv'})); a.download = `ganong_${pid}.csv`; a.click();
}
async function loadSupabase(){
  if(window.supabase) return window.supabase;
  return new Promise(res => { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; s.onload = () => res(window.supabase); s.onerror = () => res(null); document.head.appendChild(s); });
}
async function save(){
  if(!USE_SUPABASE) return false;
  const lib = await loadSupabase(); if(!lib) return false;
  const sb = lib.createClient(SUPABASE_URL, SUPABASE_KEY);
  try{
    let r = await sb.from(T_SUBJECTS).insert(subject); if(r.error) throw r.error;
    for(let i=0;i<results.length;i+=50){ r = await sb.from(T_RESPONSES).insert(results.slice(i,i+50)); if(r.error) throw r.error; }
    return true;
  }catch(e){ console.error('save failed', e); return false; }
}

function summaryHTML(){
  const rows = [];
  for(const k of Object.keys(PAIRS)){
    const cell = s => { const r = results.filter(x => x.pair===k && x.stim_type===s); return r.length ? Math.round(100*r.reduce((a,x)=>a+x.chose_word,0)/r.length)+'%' : '–'; };
    rows.push(`<tr><td>${PAIRS[k].word} / ${PAIRS[k].non}</td><td>${cell('word')}</td><td>${cell('amb')}</td><td>${cell('non')}</td></tr>`);
  }
  return `<table><tr><th>Pair</th><th>Word endpoint</th><th>Ambiguous</th><th>Non-word endpoint</th></tr>${rows.join('')}</table><p class="note">% of trials on which the real-word option was chosen.</p>`;
}

async function finish(){
  render(`<div class="center"><h2>Saving…</h2><p class="note">Please wait / 저장 중입니다</p></div>`);
  const ok = await save();
  render(`<h2>Thank you!</h2><p>${ok ? 'Your responses were saved. You can close this page.' : '<span class="err">Your responses could not be sent automatically.</span> Please click the button below and send the downloaded file to the researcher.'}</p>
    <p class="ko">${ok ? '응답이 저장되었습니다. 창을 닫으셔도 됩니다. 감사합니다!' : '자동 저장에 실패했습니다. 아래 버튼으로 파일을 내려받아 연구자에게 보내 주세요.'}</p>
    <p class="note">Participant ID: ${pid}</p>
    ${ok ? '' : '<button class="btn" id="dl">Download my data (CSV)</button>'}
    ${SHOW_RESULTS ? '<h2 style="margin-top:24px">Researcher view</h2>'+summaryHTML()+'<button class="btn" id="dl2">Download CSV</button>' : ''}`);
  const d1 = document.getElementById('dl'), d2 = document.getElementById('dl2');
  if(d1) d1.onclick = downloadCSV; if(d2) d2.onclick = downloadCSV;
}

screenWelcome();
</script>
